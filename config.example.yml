# Galaxy Profile README Configuration
# Copy this file to config.yml and replace the neutral placeholders.

username: "your-github-handle"

profile:
  name: "Your Name"
  tagline: "Your studio or concise public thesis"
  company: "Your Studio"
  bio: |
    State what you make, who it serves, and what principles connect the work.
  philosophy: '"A short sentence that actually governs the projects."'

social:
  website: "https://github.com/your-github-handle"

galaxy_arms:
  - name: "Focus One"
    color: "synapse_cyan"
    items: ["System", "Practice", "Tool"]
  - name: "Focus Two"
    color: "dendrite_violet"
    items: ["System", "Practice", "Tool"]
  - name: "Focus Three"
    color: "axon_amber"
    items: ["System", "Practice", "Tool"]

# Only list repositories that are explicitly safe for public display.
projects:
  - repo: "your-github-handle/example-project"
    arm: 0
    description: "One honest sentence describing the project and its state."

theme:
  void: "#080c14"
  nebula: "#0f1623"
  star_dust: "#1a2332"
  synapse_cyan: "#00d4ff"
  dendrite_violet: "#a78bfa"
  axon_amber: "#ffb020"
  text_bright: "#f1f5f9"
  text_dim: "#94a3b8"
  text_faint: "#64748b"

stats:
  metrics: ["commits", "stars", "prs", "issues", "repos"]

languages:
  exclude: ["HTML", "CSS", "Shell", "Makefile"]
  max_display: 6
